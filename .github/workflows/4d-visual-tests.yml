name: 4D Visual Test Suite env:
  

on:
  push:
    branches: [main]
    paths:
      - 'python/ethos_4d/**'
      - 'python/tests/test_4d_visual.py'
      - 'python/pyproject.toml'
      - '.github/workflows/4d-visual-tests.yml'
  pull_request:
    paths:
      - 'python/ethos_4d/**'
      - 'python/tests/test_4d_visual.py'
      - 'python/pyproject.toml'
      - '.github/workflows/4d-visual-tests.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual trigger reason'
        required: false
        default: 'manual'

permissions:
  contents: read

concurrency:
  group: 4d-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Unit tests across Python 3.10 / 3.11 / 3.12 ────────────────
  unit-tests:
    name: Unit Tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run 4D visual unit tests
        run: |
          python -m pytest tests/test_4d_visual.py \
            -v --tb=short --color=yes -x

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: python/.pytest_cache/

  # ── Job 2: Full immersive render smoke test ─────────────────────────────
  render-smoke:
    name: 4D Immersive Render (full output)
    runs-on: ubuntu-latest
    needs: unit-tests

    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run 4D test harness (full render)
        run: |
          python -m ethos_4d.test_harness 2>&1 | tee 4d-render-output.txt
          echo "Exit: $?"

      - name: Assert render output is substantive
        run: |
          lines=$(wc -l < 4d-render-output.txt)
          echo "Render produced $lines lines"
          [ "$lines" -gt 20 ] || (echo "❌ Render too short" && exit 1)
          echo "✅ Render output looks good"

      - name: Upload render artifact
        uses: actions/upload-artifact@v4
        with:
          name: 4d-render-output
          path: python/4d-render-output.txt

  # ── Job 3: Scientific metrics validation ───────────────────────────────
  metrics-validation:
    name: Scientific Metrics Validation
    runs-on: ubuntu-latest
    needs: unit-tests

    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate spacetime metrics scientifically
        run: |
          python3 - << 'PYEOF'
          from ethos_4d.spacetime import EthosSpacetime, ETHICAL_WEIGHT, TASK_STATE_ORDINAL
          from ethos_4d.metrics import SpacetimeMetrics
          from ethos_4d.test_harness import FourDTestHarness

          print("🔬 Running scientific metrics validation...")

          harness = FourDTestHarness()
          harness.simulate_tasks()
          m = harness.metrics

          tensors = m.ethical_curvature()
          assert len(tensors) == len(TASK_STATE_ORDINAL) - 2, \
              f"Expected {len(TASK_STATE_ORDINAL)-2} tensors, got {len(tensors)}"
          print(f"  ✅ Curvature tensor: {len(tensors)} entries")

          transitions = m.detect_phase_transitions()
          crit = [t for t in transitions if t.significance == "CRITICAL"]
          assert len(crit) > 0, "No critical phase transitions detected"
          print(f"  ✅ Critical phase transitions: {len(crit)} detected")

          H = m.manifold_entropy()
          assert H > 0.0, f"Entropy should be > 0, got {H}"
          print(f"  ✅ Manifold entropy: {H:.4f} bits")

          for g in m.geodesic_reports():
              assert g.deviation_ratio >= 1.0 - 1e-9, \
                  f"Task {g.task_id}: ratio {g.deviation_ratio} < 1.0"
          print(f"  ✅ Geodesic triangle inequality holds")

          for state, w in ETHICAL_WEIGHT.items():
              assert 0.0 <= w <= 1.0, f"{state} weight {w} out of [0,1]"
          print(f"  ✅ All ethical weights in [0.0, 1.0]")

          report = m.full_report()
          for key in ["curvature_tensors","phase_transitions",
                      "manifold_entropy_bits","geodesic_reports","lyapunov_exponent"]:
              assert key in report, f"Missing key: {key}"
          print(f"  ✅ Full report schema complete")

          print("\n✦ All scientific validations passed.")
          PYEOF
