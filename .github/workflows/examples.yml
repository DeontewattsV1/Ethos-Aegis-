name: examples

on:
  push:
    branches: [main, "fix/dependabot-security-2026-09"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  remediate-dependabot:
    name: Remediate Dependabot alerts
    if: github.ref_name == 'fix/dependabot-security-2026-09' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Normalize package manager and pin patched transitive dependencies
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides || {}),
            'vite': '8.0.16',
            'nanoid': '3.3.18',
            'brace-expansion': '5.0.9',
            'linkify-it': '5.0.2',
            'postcss': '8.5.23'
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const replPath = 'repl.ts';
          if (fs.existsSync(replPath)) {
            const before = fs.readFileSync(replPath, 'utf8');
            fs.writeFileSync(replPath, before.replace('Run with: `pnpm repl`', 'Run with: `npm run repl`'));
          }
          NODE

          rm -f pnpm-lock.yaml
          cat > .github/dependabot.yml <<'YAML'
          version: 2
          updates:
            - package-ecosystem: "npm"
              directory: "/"
              schedule:
                interval: "daily"
              open-pull-requests-limit: 10
          YAML

      - name: Regenerate canonical npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact lockfile
        run: npm ci

      - name: Verify patched dependency versions
        shell: bash
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          const expected = {
            'node_modules/vite': '8.0.16',
            'node_modules/nanoid': '3.3.18',
            'node_modules/brace-expansion': '5.0.9',
            'node_modules/linkify-it': '5.0.2',
            'node_modules/postcss': '8.5.23'
          };
          for (const [path, expectedVersion] of Object.entries(expected)) {
            const actual = lock.packages?.[path]?.version;
            console.log(`${path}: ${actual ?? 'missing'}`);
            if (actual !== expectedVersion) process.exitCode = 1;
          }
          NODE

      - name: Type-check
        run: npm run lint
      - name: Test
        run: npm test
      - name: Verify living docs
        run: npm run verify
      - name: Build
        run: npm run build
      - name: Audit dependency graph
        run: npm audit --audit-level=moderate

      - name: Restore temporary workflow edits and commit remediation
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/examples.yml > .github/workflows/examples.yml
          rm -f .github/workflows/dependabot-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remediate Dependabot dependency alerts'
          git push origin HEAD:fix/dependabot-security-2026-09

  smoke:
    if: github.ref_name != 'fix/dependabot-security-2026-09'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      - name: Execute every example and capture output
        run: npx tsx scripts/run-examples.ts

      - name: Validate snapshots
        run: npx tsx scripts/validate-docs.ts

      - name: Fail if examples drifted from snapshots
        run: |
          if ! git diff --quiet docs/output-snapshots; then
            echo "::error::Snapshot drift detected. Run 'npm run docs' locally to update output snapshots." >&2
            git --no-pager diff docs/output-snapshots
            exit 1
          fi
