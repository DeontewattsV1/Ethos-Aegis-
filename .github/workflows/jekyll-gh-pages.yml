# CI-only build of the legacy Jekyll representation of the repository.
# The single Pages publisher is .github/workflows/static.yml, which stages
# docs/aegis-brief and all three docs/demos recordings.
name: Validate Jekyll content (no deployment)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - '.github/workflows/jekyll-gh-pages.yml'
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jekyll-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Jekyll build validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify generated entrypoint
        shell: bash
        run: |
          set -euo pipefail
          test -d _site
          test -n "$(find _site -type f -print -quit)"
          echo 'Legacy Jekyll site builds; static.yml is the only public Pages publisher.'
      - name: Retain Jekyll build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: legacy-jekyll-validation
          path: ./_site
          retention-days: 7
