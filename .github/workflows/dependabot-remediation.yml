name: One-shot Dependabot remediation

on:
  push:
    branches:
      - fix/dependabot-security-2026-09
    paths:
      - .github/workflows/dependabot-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Normalize package manager and pin patched transitive dependencies
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides || {}),
            'vite': '8.0.16',
            'nanoid': '3.3.18',
            'brace-expansion': '5.0.9',
            'linkify-it': '5.0.2',
            'postcss': '8.5.23'
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const replPath = 'repl.ts';
          if (fs.existsSync(replPath)) {
            const before = fs.readFileSync(replPath, 'utf8');
            const after = before.replace('Run with: `pnpm repl`', 'Run with: `npm run repl`');
            fs.writeFileSync(replPath, after);
          }
          NODE

          rm -f pnpm-lock.yaml

          cat > .github/dependabot.yml <<'YAML'
          version: 2
          updates:
            - package-ecosystem: "npm"
              directory: "/"
              schedule:
                interval: "daily"
              open-pull-requests-limit: 10
          YAML

      - name: Regenerate canonical npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install exact locked dependencies
        run: npm ci

      - name: Verify patched dependency floors
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const lock = require('./package-lock.json');
          const expected = {
            'node_modules/vite': '8.0.16',
            'node_modules/nanoid': '3.3.18',
            'node_modules/brace-expansion': '5.0.9',
            'node_modules/linkify-it': '5.0.2',
            'node_modules/postcss': '8.5.23'
          };
          let failed = false;
          for (const [path, version] of Object.entries(expected)) {
            const actual = lock.packages?.[path]?.version;
            console.log(`${path}: ${actual ?? 'missing'} (expected ${version})`);
            if (actual !== version) failed = true;
          }
          if (failed) process.exit(1);
          NODE

      - name: Type-check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify living docs
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Audit production and development dependency graph
        run: npm audit --audit-level=moderate

      - name: Remove one-shot workflow and commit verified remediation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/dependabot-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A package.json package-lock.json pnpm-lock.yaml repl.ts .github/dependabot.yml .github/workflows/dependabot-remediation.yml
          if git diff --cached --quiet; then
            echo 'No remediation changes to commit.'
            exit 0
          fi
          git commit -m 'fix: remediate Dependabot dependency alerts'
          git push origin HEAD:fix/dependabot-security-2026-09
