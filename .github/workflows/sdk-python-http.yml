# Standalone HTTP transport must not depend on the monorepo Python core.
name: Python SDK HTTP-only import contract

on:
  push:
    branches: [main]
    paths:
      - 'sdk/python/**'
      - '.github/workflows/sdk-python-http.yml'
  pull_request:
    paths:
      - 'sdk/python/**'
      - '.github/workflows/sdk-python-http.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-python-sdk:
    name: Isolated Python SDK (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test and wheel tooling
        run: python -m pip install 'pytest>=8.0' 'build>=1.2'

      - name: Test HTTP-only import while denying embedded-core imports
        run: python -m pytest sdk/python/tests/test_http_only_import.py -q

      - name: Build standalone Python SDK wheel without publishing
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-python-wheel"
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/sdk-python-wheel" ./sdk/python

      - name: Exercise installed HTTP client in an isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/http-client-smoke"
          "$RUNNER_TEMP/http-client-smoke/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/sdk-python-wheel/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/http-client-smoke/bin/python" -I - <<'PY'
          import importlib.util
          from importlib.metadata import version

          assert importlib.util.find_spec("ethos_aegis") is None, "core unexpectedly installed"
          from ethos_aegis_sdk import AegisClient, AegisClientError, GuardedResponse
          assert version("ethos-aegis-sdk") == "1.0.0"
          assert callable(AegisClient)
          assert issubclass(AegisClientError, Exception)
          assert GuardedResponse is not None
          client = AegisClient(
              transport="http",
              server_url="https://example.test/v1/adjudicate",
              auto_nourish=False,
          )
          assert client._transport == "http"
          print("Standalone HTTP SDK wheel import and construction passed")
          PY
