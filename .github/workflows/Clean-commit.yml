name: Clean commit messages

# The checked-in file was a marketplace step for clean-commit-action v0.2.0.
# That tag is ad1992/clean-commit-action@887cfa1f5bb8a53b74c83905b8685a23886070c2.
# deontewattsv1/clean-commit-action does not exist. The action rejects pull
# request commit messages shorter than 10 characters or containing
# temp, tmp, fixup, squash, or wip.
on:
  pull_request:

permissions:
  contents: read

jobs:
  clean-commit:
    name: Reject placeholder commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit messages (custom)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          # Determine merge base against the base branch
          if git show-ref --verify --quiet refs/remotes/origin/${BASE_REF}; then
            echo "Found origin/${BASE_REF}"
          else
            echo "Fetching origin/${BASE_REF}"
            if ! git fetch origin ${BASE_REF}:${BASE_REF}; then
              echo "Warning: git fetch failed; continuing with available local refs"
            fi
          fi

          if MERGE_BASE=$(git merge-base HEAD origin/${BASE_REF}); then
            :
          else
            MERGE_BASE=""
          fi

          if [ -z "${MERGE_BASE}" ] || [ "${MERGE_BASE}" = "" ]; then
            echo "Unable to determine merge base; falling back to checking last 20 commits"
            COMMITS=$(git rev-list --max-count=20 --reverse HEAD)
          else
            COMMITS=$(git rev-list --reverse ${MERGE_BASE}..HEAD)
          fi

          echo "Checking commit message quality for $(echo "$COMMITS" | wc -l) commits"

          bad=0
          for c in $COMMITS; do
            subj=$(git show -s --format=%s $c)
            author=$(git show -s --format='%an <%ae>' $c)

            # Ignore commits authored by known bots/automations
            author_lc=$(echo "$author" | tr '[:upper:]' '[:lower:]')
            if echo "$author_lc" | egrep -qi 'bot|dependabot|copilot|ci-fixer|github-actions'; then
              echo "Skipping commit $c by automaton: $author"
              continue
            fi

            # Subject rules: at least 10 chars and must not contain placeholder tokens
            subj_trim=$(echo "$subj" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            subj_len=${#subj_trim}

            if [ "$subj_len" -lt 10 ]; then
              echo "BAD: commit $c subject too short (${subj_len} chars): '$subj'"
              bad=1
              continue
            fi

            if echo "$subj" | egrep -qi '\b(temp|tmp|fixup|squash|wip)\b'; then
              echo "BAD: commit $c subject contains placeholder token: '$subj'"
              bad=1
              continue
            fi

            echo "OK: $c - $subj"
          done

          if [ "$bad" -ne 0 ]; then
            echo "One or more commit messages failed validation"
            exit 1
          fi
