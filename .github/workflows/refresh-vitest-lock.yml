name: Refresh Vitest Lockfile

on:
  push:
    branches:
      - fix/ci-post-merge-repairs
    paths:
      - package.json
      - .github/workflows/refresh-vitest-lock.yml

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Regenerate lockfile from npm metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install resolution
        run: npm ci --ignore-scripts

      - name: Upload verified lockfile
        uses: actions/upload-artifact@v4
        with:
          name: vitest-5-lockfile
          path: package-lock.json
          retention-days: 1
