name: Refresh Vitest Lockfile

on:
  push:
    branches:
      - fix/ci-post-merge-repairs
    paths:
      - package.json
      - .github/workflows/refresh-vitest-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Regenerate lockfile from npm metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install resolution
        run: npm ci --ignore-scripts

      - name: Commit regenerated lockfile and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-vitest-lock.yml
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required"
            exit 0
          fi
          git commit --signoff -m "fix(deps): regenerate Vitest 5 lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
