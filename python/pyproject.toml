[project]
name = "ethos-aegis"
version = "1.0.0"
description = "Ethos Aegis -- Sovereign AI Immune Architecture. Production-grade AI safety enforcement with biologically-inspired defense cells."
authors = [
    {name = "Deonte Watts", email = "deonte@goodshyt.group"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ai-safety", "immune-system", "hallucination-detection", "prompt-injection", "adversarial-defense"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

dependencies = []  # Zero mandatory dependencies -- pure stdlib

[project.optional-dependencies]
llm = [
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "google-generativeai>=0.7.0",
    "mistralai>=1.0.0",
]
server = [
    "uvicorn>=0.30.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.6.3",
    "mypy>=1.11.0",
    "bandit>=1.7.9",
    "pip-audit>=2.7.3",
]
test = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
]

[project.urls]
Homepage = "https://github.com/DeontewattsV1/Ethos-Aegis-"
Repository = "https://github.com/DeontewattsV1/Ethos-Aegis-"
Issues = "https://github.com/DeontewattsV1/Ethos-Aegis-/issues"
Changelog = "https://github.com/DeontewattsV1/Ethos-Aegis-/blob/main/CHANGELOG.md"

[project.scripts]
ethos-aegis = "ethos_aegis.__main__:main"
aegis-server = "ethos_aegis.server:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths  = ["tests"]
timeout    = 60
addopts    = "-ra -q --tb=short"

[tool.ruff]
line-length    = 120
target-version = "py310"

[tool.ruff.lint]
# ── Rules enabled ───────────────────────────────────────────────────────────
select = [
    "F",    # pyflakes (unused imports, undefined names, etc.)
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear
    "I",    # isort
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "S",    # bandit-style security via ruff
]

# ── Rules ignored (pre-existing style in this research codebase) ────────────
ignore = [
    # Line length -- handled by black/formatter, not ruff
    "E501",
    # Exception chaining -- extensive use of raise-in-except throughout codebase
    "B904",
    # Useless expressions -- intentional docstring-style strings in some modules
    "B018",
    # Mutable default arguments -- intentional in some dataclass patterns
    "B006",
    # Loop variable not used -- intentional in several benchmarks
    "B007",
    # Unused imports -- re-exported in __init__.py files
    "F401",
    # f-string without placeholders -- intentional template strings
    "F541",
    # Module level import not at top -- conditional imports for optional deps
    "E402",
    # Invalid escape sequence -- raw strings in docstrings
    "W605",
    # Ambiguous variable name -- scientific notation uses i, l, etc.
    "E741",
    # Do not catch blind exception -- necessary in adapter error handling
    "B017",
    # Zip without explicit strict -- intentional in performance-critical loops
    "B905",
    # assert in tests
    "S101",
    # subprocess calls -- used in CI scripts
    "S603", "S607",
    # hardcoded passwords -- test fixtures only
    "S105", "S106",
    # bandit hash functions -- sha256 is intentional for content hashing
    "S324",
]

[tool.ruff.lint.per-file-ignores]
"tests/*"  = ["S101", "F401", "F811", "B", "SIM"]
"**/__init__.py" = ["F401"]
"scripts/*" = ["S", "B"]
"**/adapters/*" = ["B904"]

[tool.mypy]
python_version       = "3.10"
ignore_missing_imports = true
no_strict_optional   = true
warn_return_any      = false
warn_unused_configs  = true
# Suppress errors in research/scaffold modules
exclude = ["tests/", "scripts/", "sdk/"]

[tool.coverage.run]
source   = ["ethos_aegis"]
omit     = ["tests/*", "scripts/*", "sdk/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under   = 0

[build-system]
requires      = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where   = ["."]
include = ["ethos_aegis*", "ethos_4d*"]
exclude = ["tests*", "scripts*", "sdk*"]
