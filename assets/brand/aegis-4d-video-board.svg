<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="boardTitle boardDescription">
  <title id="boardTitle">Ethos Aegis animated leukocyte defense board</title>
  <desc id="boardDescription">Illustrative simulation of teal and gold immune cells with translucent membranes, granules, lobed nuclei and pseudopods engaging threats. Not a live scanner.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#101c2e"/>
      <stop offset="60%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#05080f"/>
    </radialGradient>
    <radialGradient id="cellGradT" cx="38%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#bffcff"/>
      <stop offset="45%" stop-color="#2fd8e6"/>
      <stop offset="100%" stop-color="#0b5f74"/>
    </radialGradient>
    <radialGradient id="cellGradG" cx="38%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="45%" stop-color="#e8b93e"/>
      <stop offset="100%" stop-color="#7a5a0e"/>
    </radialGradient>
    <radialGradient id="virusGrad" cx="40%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#ffb3d9"/>
      <stop offset="45%" stop-color="#c2458f"/>
      <stop offset="100%" stop-color="#4a1038"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#12263d" stroke-width="1"/>
    </pattern>

    <!-- spiky virus -->
    <g id="virus">
      <g stroke="#e067ae" stroke-width="3" stroke-linecap="round">
        <line x1="0" y1="-26" x2="0" y2="-40"/><line x1="18" y1="-18" x2="28" y2="-28"/>
        <line x1="26" y1="0" x2="40" y2="0"/><line x1="18" y1="18" x2="28" y2="28"/>
        <line x1="0" y1="26" x2="0" y2="40"/><line x1="-18" y1="18" x2="-28" y2="28"/>
        <line x1="-26" y1="0" x2="-40" y2="0"/><line x1="-18" y1="-18" x2="-28" y2="-28"/>
      </g>
      <circle r="26" fill="url(#virusGrad)" stroke="#ff8ecb" stroke-width="2"/>
      <circle cx="-8" cy="-6" r="5" fill="#5e1247"/>
      <circle cx="9" cy="4" r="4" fill="#5e1247"/>
      <circle cx="-2" cy="11" r="3.4" fill="#5e1247"/>
    </g>

    <!-- Biologically-inspired leukocyte cells for the Vitality/Leukocyte Framework.
         Teal sentinels and gold adjudicators share an irregular membrane and multi-lobed nuclei. -->
    <g id="cellT" data-cell-role="sentinel" aria-label="Cyan leukocyte with lobed nucleus and granules">
      <path d="M0 -29 C9 -33 15 -27 21 -24 C29 -21 27 -12 32 -5 C35 3 29 12 28 20 C23 28 14 29 6 31 C-4 35 -14 28 -22 26 C-31 21 -30 12 -32 3 C-34 -7 -28 -18 -21 -24 C-12 -30 -7 -29 0 -29Z" fill="#2bd6d5" opacity=".18" stroke="#89ffff" stroke-width="2.8"/>
      <path d="M0 -24 C10 -26 18 -22 23 -14 C29 -4 26 9 21 18 C15 27 2 28 -9 24 C-21 22 -26 10 -25 -1 C-25 -14 -14 -23 0 -24Z" fill="url(#cellGradT)" opacity=".72" stroke="#bafffa" stroke-width="1.2"/>
      <g fill="#172c51" stroke="#457796" stroke-width="1"><circle cx="-8" cy="-9" r="7"/><circle cx="4" cy="-4" r="8.5"/><circle cx="5" cy="10" r="8"/></g>
      <path d="M-8 -4 Q-2 -3 0 0 M4 4 Q6 5 5 6" stroke="#23486e" stroke-width="4" fill="none"/>
      <g fill="#e0ffdb"><circle cx="-19" cy="-4" r="1.7"/><circle cx="-17" cy="13" r="1.8"/><circle cx="-10" cy="19" r="1.4"/><circle cx="14" cy="-16" r="1.6"/><circle cx="18" cy="5" r="1.8"/><circle cx="16" cy="17" r="1.4"/><circle cx="-4" cy="-20" r="1.4"/><circle cx="21" cy="-5" r="1.3"/></g>
      <g stroke="#86f8ee" stroke-width="2" stroke-linecap="round"><path d="M-23 -21 L-30 -27 M20 -24 L27 -30 M31 -7 L39 -9 M28 19 L35 25 M-22 25 L-29 31 M-31 3 L-38 5"/></g>
      <ellipse cx="-10" cy="-13" rx="8.5" ry="4" fill="#e4ffff" opacity=".18"/>
    </g>
    <g id="cellG" data-cell-role="adjudicator" aria-label="Gold leukocyte with lobed nucleus and granules">
      <path d="M0 -27 C10 -31 16 -23 22 -18 C28 -12 27 -4 30 3 C30 12 24 22 14 26 C4 29 -5 30 -15 25 C-26 24 -30 12 -28 3 C-31 -8 -24 -20 -15 -23 C-8 -28 -4 -27 0 -27Z" fill="#e8b93e" opacity=".19" stroke="#ffe49a" stroke-width="2.8"/>
      <path d="M0 -22 C11 -25 19 -19 22 -9 C27 1 23 14 15 19 C8 25 -6 24 -15 19 C-23 13 -25 0 -22 -9 C-18 -19 -11 -23 0 -22Z" fill="url(#cellGradG)" opacity=".8" stroke="#fff0b9" stroke-width="1.2"/>
      <g fill="#403256" stroke="#8e7494" stroke-width="1"><circle cx="-7" cy="-8" r="6"/><circle cx="7" cy="-2" r="7"/><circle cx="-1" cy="10" r="6.8"/></g>
      <path d="M-2 -5 Q0 -3 1 0 M3 4 Q2 6 0 6" stroke="#5a4468" stroke-width="3.3" fill="none"/>
      <g fill="#fff8c9"><circle cx="-18" cy="-4" r="1.5"/><circle cx="-15" cy="12" r="1.6"/><circle cx="-8" cy="19" r="1.2"/><circle cx="15" cy="-13" r="1.5"/><circle cx="18" cy="10" r="1.7"/><circle cx="4" cy="-18" r="1.2"/><circle cx="-16" cy="-13" r="1.2"/></g>
      <g stroke="#ffe19b" stroke-width="1.9" stroke-linecap="round"><path d="M-23 -18 L-30 -23 M23 -17 L30 -22 M29 4 L36 5 M16 25 L20 32 M-17 25 L-21 31 M-28 2 L-35 3"/></g>
      <ellipse cx="-8" cy="-13" rx="7" ry="3.5" fill="#fff4d4" opacity=".28"/>
    </g>

    <!-- malware shard -->
    <g id="shard">
      <rect x="-26" y="-14" width="52" height="28" rx="4" fill="#0d1524" stroke="#3a4a63" stroke-width="1.4"/>
      <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="13" fill="#8fa3c0">&lt;/&gt;</text>
    </g>
  </defs>

  <!-- background -->
  <rect width="1200" height="560" fill="url(#bgGlow)"/>
  <rect width="1200" height="560" fill="url(#grid)" opacity="0.55"/>

  <!-- header -->
  <text x="40" y="52" font-family="monospace" font-size="24" fill="#e8b93e" letter-spacing="4">ETHOS AEGIS // 4D IMMERSIVE DEFENSE BOARD</text>
  <circle cx="1148" cy="44" r="7" fill="#ff4f5e" filter="url(#softGlow)">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="1128" y="50" text-anchor="end" font-family="monospace" font-size="14" fill="#ff4f5e">SIM</text>
  <line x1="40" y1="66" x2="1160" y2="66" stroke="#1d3355" stroke-width="1"/>

  <!-- legend -->
  <g font-family="monospace" font-size="13" fill="#9db4cc">
    <circle cx="56" cy="104" r="6" fill="#2fd8e6"/><text x="72" y="109">VanguardProbe / SanitasSwarm</text>
    <circle cx="56" cy="130" r="6" fill="#e8b93e"/><text x="72" y="135">FinalityForge</text>
    <circle cx="56" cy="156" r="6" fill="#c2458f"/><text x="72" y="161">MoralMaligna / NarcissisMaligna</text>
  </g>

  <!-- ============ ENGAGEMENT 1: teal cell hunts virus, engulfs ============ -->
  <g>
    <use href="#virus" x="620" y="200" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 14 -10; -8 8; 0 0" dur="9s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.42;0.5;0.92;1" dur="9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1;0.15;0.15;1" keyTimes="0;0.42;0.5;0.92;1" dur="9s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#cellT" filter="url(#glow)">
      <animateMotion dur="9s" repeatCount="indefinite" path="M180 210 C 300 120, 420 260, 620 200 L 620 200 C 500 300, 320 320, 180 210" keyPoints="0;0.42;0.42;1" keyTimes="0;0.42;0.55;1" calcMode="linear"/>
    </use>
    <!-- engulf flash + particle burst -->
    <circle cx="620" cy="200" r="10" fill="none" stroke="#7ff3ff" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.42;0.47;0.58;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="r" values="10;10;70;110;110" keyTimes="0;0.42;0.47;0.58;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <g fill="#e8b93e" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.44;0.5;0.66;1" dur="9s" repeatCount="indefinite"/>
      <circle cx="620" cy="200" r="3"><animateTransform attributeName="transform" type="translate" values="0 0;0 0;34 -40;58 -70" keyTimes="0;0.44;0.56;0.66" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="200" r="2.4"><animateTransform attributeName="transform" type="translate" values="0 0;0 0;-40 -26;-70 -46" keyTimes="0;0.44;0.56;0.66" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="200" r="2.8"><animateTransform attributeName="transform" type="translate" values="0 0;0 0;26 42;46 74" keyTimes="0;0.44;0.56;0.66" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="620" cy="200" r="2.2"><animateTransform attributeName="transform" type="translate" values="0 0;0 0;-30 36;-52 64" keyTimes="0;0.44;0.56;0.66" dur="9s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- ============ ENGAGEMENT 2: gold cell dissolves malware shard ============ -->
  <g>
    <use href="#shard" x="950" y="330">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.6;0.9;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </use>
    <use href="#cellG" filter="url(#glow)">
      <animateMotion dur="7s" begin="1.5s" repeatCount="indefinite" path="M1140 480 C 1080 420, 1010 400, 950 330 L 950 330 C 1020 380, 1100 420, 1140 480" keyPoints="0;0.5;0.5;1" keyTimes="0;0.5;0.66;1" calcMode="linear"/>
    </use>
    <circle cx="950" cy="330" r="8" fill="none" stroke="#ffe9a8" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.5;0.55;0.66;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="8;8;52;84;84" keyTimes="0;0.5;0.55;0.66;1" dur="7s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ ENGAGEMENT 3: pair of cells corner a virus ============ -->
  <g>
    <use href="#virus" x="360" y="400" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-12 8;10 -6;0 0" dur="11s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.58;0.9;1" dur="11s" begin="0.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1;0.12;0.12;1" keyTimes="0;0.5;0.58;0.9;1" dur="11s" begin="0.8s" repeatCount="indefinite" additive="sum"/>
    </use>
    <use href="#cellT" filter="url(#glow)">
      <animateMotion dur="11s" begin="0.8s" repeatCount="indefinite" path="M120 470 C 200 430, 280 470, 360 400 L 360 400 C 280 350, 180 380, 120 470" keyPoints="0;0.5;0.5;1" keyTimes="0;0.5;0.64;1" calcMode="linear"/>
    </use>
    <use href="#cellG" filter="url(#glow)">
      <animateMotion dur="11s" begin="0.8s" repeatCount="indefinite" path="M560 490 C 500 430, 430 480, 366 408 L 366 408 C 440 360, 520 400, 560 490" keyPoints="0;0.5;0.5;1" keyTimes="0;0.5;0.64;1" calcMode="linear"/>
    </use>
    <circle cx="360" cy="400" r="10" fill="none" stroke="#7ff3ff" stroke-width="3" opacity="0">
      <animate attributeName="opacity" values="0;0;0.85;0;0" keyTimes="0;0.5;0.55;0.68;1" dur="11s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="10;10;66;104;104" keyTimes="0;0.5;0.55;0.68;1" dur="11s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- drifting background cells -->
  <use href="#cellT" opacity="0.5">
    <animateMotion dur="16s" repeatCount="indefinite" path="M1080 120 C 900 90, 760 140, 640 110 C 760 170, 940 160, 1080 120"/>
  </use>
  <use href="#cellG" opacity="0.45">
    <animateMotion dur="19s" repeatCount="indefinite" path="M220 330 C 330 300, 430 340, 520 310 C 420 370, 300 370, 220 330"/>
  </use>

  <!-- scanline sweep -->
  <rect x="0" y="80" width="1200" height="3" fill="#2fd8e6" opacity="0.25" filter="url(#softGlow)">
    <animate attributeName="y" values="80;470;80" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- pipeline strip -->
  <line x1="40" y1="498" x2="1160" y2="498" stroke="#1d3355" stroke-width="1"/>
  <g font-family="monospace" font-size="14" fill="#7f97b5">
    <text x="80"  y="532" text-anchor="middle">SIGNATURE SCAN</text>
    <text x="290" y="532" text-anchor="middle">HEURISTIC</text>
    <text x="480" y="532" text-anchor="middle">BEHAVIOR</text>
    <text x="660" y="532" text-anchor="middle">SANDBOX</text>
    <text x="840" y="532" text-anchor="middle">QUARANTINE</text>
    <text x="1060" y="532" text-anchor="middle" fill="#e8b93e">NEUTRALIZE</text>
  </g>
  <g stroke="#2a4a75" stroke-width="1.4" fill="none">
    <path d="M150 524 H 220 M 360 524 H 410 M 550 524 H 590 M 730 524 H 760 M 910 524 H 980"/>
  </g>
  <circle r="5" fill="#7ff3ff" filter="url(#softGlow)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M80 512 H 1060"/>
  </circle>
</svg>
