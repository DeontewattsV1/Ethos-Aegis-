[project]
name = "ethos-aegis-governance"
version = "0.1.0"
description = "Ethos Aegis governance engine (separate from the ethos-aegis Python subtree distribution)"
authors = [
    {name = "Deonte Watts"}
]
requires-python = ">=3.12"
license = {text = "CC0-1.0"}

dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.4",
    "neo4j>=5.24.0",
    "networkx>=3.3",
    "pyyaml>=6.0.2",
    "structlog>=24.4.0",
    "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.3",
    "mypy>=1.11.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

# Package only the separate root governance engine, never the python/ subtree.
# Explicit discovery avoids accidental inclusion of the other distribution.
[tool.setuptools.packages.find]
where = ["."]
include = ["ethos_core*", "agents*", "graph*", "simulation*"]
